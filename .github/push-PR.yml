name: Push and PR

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "src/**"
      - ".github/workflows/push-PR.yml"

  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test